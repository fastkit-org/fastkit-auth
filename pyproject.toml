[project]
name = "fastkit-auth"
version = "0.1.0"
description = "Lightweight package for atuhentication, registration and edit profile"
readme = "README.md"
authors = [
    { name = "Codevelo", email = "info@codevelo.io" }
]

requires-python = ">=3.12"
dependencies = [
    "fastkit-core>=0.3.5",
    "mailbridge>=2.0.0",
    "passlib>=1.7.4",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.11.0",
    "alembic",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.uv-build]
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]